version: 2

# All version updates land in one pull request. While that PR is open,
# Dependabot keeps refreshing it on each run instead of opening new ones;
# after it is merged, the next run opens a fresh bundle.
# Security updates are not grouped here and still arrive as they are found.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Manila
    labels: ["dependencies"]

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    ignore:
      # Node majors change the runtime (Node 26 needs libatomic1 in the image);
      # move LTS lines deliberately in their own PR.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /render
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
