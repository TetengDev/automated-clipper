[project]
name = "clipper"
version = "0.1.0"
description = "24/7 auto-clipper: detect new creator videos, pick highlights with Claude, render vertical clips for human review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.17.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.156.4",
    "httpx>=0.27",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "opencv-python-headless==5.0.0.93",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "scenedetect==0.7.2",
    "tenacity>=9.0",
    "typer>=0.12",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.1.1",
]

[project.scripts]
clipper = "clipper.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.uv]
# scenedetect requires GUI `opencv-python` (Qt, libGL); the headless build above provides
# the same `cv2` module, so the GUI one is never installed. Only uv honours this override:
# install with `uv sync` (pip would pull in opencv-python next to the headless build).
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "render: real Remotion render; skips when node/npx or render/node_modules is missing",
    "slow: real media processing (ffmpeg, scene detection); skips when ffmpeg is missing",
]

[tool.coverage.run]
source = ["clipper"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
