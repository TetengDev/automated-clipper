name: Nightly slow tests

# The `slow` and `render` tests skip in CI: a real `tiny` Whisper model, real scene and face
# detection, and real Remotion renders. This runs them against dev every night (CLP-72); a
# failure shows up as GitHub's failed-run notification. `schedule` only fires from the
# default branch's copy of this file. A PR that changes this file runs it on its own code.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/nightly-slow.yml"]

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Absolute: conftest runs each test in its own tmp dir, so the relative default
      # (data/models) would not find the models. The tiny Whisper test reads data/models
      # under the checkout directly, so both point at the same place.
      CLIPPER_MODELS_DIR: ${{ github.workspace }}/data/models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'dev' }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.31"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/dev' }}

      # A stalled mirror once hung this step for over an hour (CLP-131): apt retries
      # and times out per request, the whole install retries once, and the step is capped.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          apt=(sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          apt_install() { "${apt[@]}" update && "${apt[@]}" install -y --no-install-recommends ffmpeg; }
          apt_install || apt_install

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: render/package-lock.json

      # As in the Dockerfile: no lifecycle scripts, and Chrome headless shell fetched up
      # front so the first render test does not download it.
      - name: Install render dependencies
        working-directory: render
        run: |
          npm ci --ignore-scripts
          npx --no-install remotion browser ensure

      # The pins come from the code (config.WHISPER_MODELS, reframe.MODEL_SHA256). Each
      # fetch fails the step if the download cannot be fetched or verified.
      - name: Fetch models
        run: |
          read -r repo sha < <(uv run python -c "from clipper.config import WHISPER_MODELS as M; print(*M['tiny'][:2])")
          uv run python -m clipper.pipeline.local_asr fetch "$repo" "$sha" "$CLIPPER_MODELS_DIR"
          uv run python -c "import sys; from clipper.pipeline.reframe import ensure_model; sys.exit(ensure_model() is None)"

      # The live YouTube probe is left out: YouTube often bot-blocks GitHub runner IPs, so
      # it would fail for reasons outside the code. Run it by hand (docs/DEPLOYMENT.md).
      - name: Slow and render tests
        env:
          CLIPPER_SLOW_TESTS: "1"
        run: >-
          uv run pytest -m "slow or render" -q --junitxml=slow.xml
          --deselect tests/test_ytdlp.py::test_real_probe_solves_youtube_challenges_with_deno

      # A slow test skips when its model, tool or setup is missing, which would keep this run
      # green while testing nothing. Any skip fails the run (deselected tests are not listed).
      - name: Fail on skipped tests
        run: |
          uv run python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse("slow.xml").getroot().iter("testcase"))
          skipped = [f"{c.get('classname')}::{c.get('name')}" for c in cases if c.find("skipped") is not None]
          print(f"{len(cases)} tests, {len(skipped)} skipped")
          for name in skipped:
              print(f"::error::skipped: {name}")
          sys.exit(1 if skipped or not cases else 0)
          EOF
