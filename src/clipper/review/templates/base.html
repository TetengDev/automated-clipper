<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config"
        content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false,
                 "responseHandling": [{"code": "204", "swap": false},
                                      {"code": "[23]..", "swap": true},
                                      {"code": "^(409|422)$", "swap": true, "error": false},
                                      {"code": "[45]..", "swap": false, "error": true}]}'>
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Clipper review{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {# htmx 2.0.4, vendored (sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+) #}
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/review.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token() }}"}'>
  <header class="topbar">
    <a class="brand" href="/queue">Clipper</a>
    {% if user %}
    <nav class="nav">
      <a href="/queue">Queue</a>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="link">Sign out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% for message in get_flashed_messages() %}
    <p class="flash" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
