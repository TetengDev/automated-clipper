name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov=clipper --cov-report=term-missing --cov-fail-under=80

      - name: Audit dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt > requirements.txt && uvx --python 3.12 pip-audit --strict --require-hashes --disable-pip -r requirements.txt

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: clipper:ci
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      - name: Smoke test image
        run: |
          mkdir -p smoke && sudo chown 10001:10001 smoke
          docker run --rm -v "$PWD/config:/app/config:ro" clipper:ci --config /app/config/creators.yaml check-config
          docker run --rm -v "$PWD/smoke:/app/data" clipper:ci --db /app/data/state.db migrate
          docker run --rm --entrypoint yt-dlp clipper:ci --version
          docker run --rm --entrypoint ffmpeg clipper:ci -version
