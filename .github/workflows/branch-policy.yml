name: Branch policy

# Required check on main and release/** (rulesets). Enforces the promotion path
# dev -> pre-release/vX.Y.Z -> release/vX.Y.Z -> main; see docs/BRANCHING.md.
on:
  pull_request:
    branches: [main, "release/**"]

permissions: {}

jobs:
  branch-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::promotion PRs must come from a branch in $REPO, not a fork"; exit 1
          fi
          semver='v[0-9]+\.[0-9]+\.[0-9]+'
          case "$BASE" in
            main)
              [[ "$HEAD" =~ ^(release|hotfix)/$semver$ ]] && exit 0
              echo "::error::main only accepts release/vX.Y.Z or hotfix/vX.Y.Z, got '$HEAD'" ;;
            release/*)
              [[ "$HEAD" == "pre-release/${BASE#release/}" || "$HEAD" =~ ^hotfix/$semver$ ]] && exit 0
              echo "::error::$BASE only accepts pre-release/${BASE#release/} or hotfix/vX.Y.Z, got '$HEAD'" ;;
          esac
          exit 1
