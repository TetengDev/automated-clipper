name: CI

on:
  pull_request:
  push:
    branches: [main, dev, "pre-release/**", "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.31"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/dev' }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov=clipper --cov-report=term-missing --cov-fail-under=80


  # Known-vulnerability gate. Required only on release/** and main (rulesets), so a
  # vulnerable dependency shows red on dev PRs but never blocks feature work;
  # fixes land in one go on the pre-release branch (docs/BRANCHING.md).
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.31"

      - name: Audit Python dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt > requirements.txt && uvx --python 3.12 --from pip-audit==2.10.1 pip-audit --strict --require-hashes --disable-pip -r requirements.txt

      - name: Audit render dependencies
        working-directory: render
        run: npm audit --omit=dev

  node:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: render
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: render/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: clipper:ci
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/dev' && 'type=gha,mode=max' || '' }}

      - name: Smoke test image
        run: |
          # The image user (uid 10001) must be able to write the DB dir.
          smoke="$(mktemp -d)" && chmod 777 "$smoke"
          run="docker run --rm --cap-drop ALL --security-opt no-new-privileges:true"
          $run -v "$PWD/config:/app/config:ro" clipper:ci --config /app/config/creators.yaml check-config
          $run -v "$smoke:/app/data" clipper:ci --db /app/data/state.db migrate
          $run --entrypoint yt-dlp clipper:ci --version
          $run --entrypoint ffmpeg clipper:ci -version
          $run --entrypoint node clipper:ci --version
          # `remotion versions` fails when any package differs from what Remotion pins. The
          # zod override (GHSA-mrhx-c7xc-m3w5, CLP-108) is a deliberate mismatch, so allow
          # exactly that one and fail on anything else. Drop this once Remotion pins zod >= 4.6.6.
          if ! out="$($run --read-only --tmpfs /tmp -w /app/render --entrypoint node clipper:ci node_modules/@remotion/cli/remotion-cli.js versions 2>&1)"; then
            echo "$out"
            mismatches="$(printf '%s\n' "$out" | grep -E '^- [^ ]+: installed ' || true)"
            # Remotion reports its own package disagreements as "Version mismatch: ...";
            # those must always fail, as must output with no single "On version:" line.
            if [ -z "$mismatches" ] \
              || printf '%s\n' "$out" | grep -q 'Version mismatch' \
              || [ "$(printf '%s\n' "$out" | grep -c '^On version: ')" != 1 ] \
              || printf '%s\n' "$mismatches" | grep -qvE '^- zod: installed 4\.(6\.([6-9]|[1-9][0-9])|([7-9]|[1-9][0-9])\.[0-9]+), required '; then
              echo "remotion versions failed for a reason other than the zod override" >&2
              exit 1
            fi
            echo "remotion versions: only the deliberate zod override differs (CLP-108)"
          else
            echo "::warning::remotion versions passes cleanly; remove the CLP-108 zod exception here and the zod override in render/package.json"
          fi

      - name: Render smoke test (read-only, non-root)
        timeout-minutes: 10
        run: >-
          docker run --rm --read-only --tmpfs /tmp --user 10001:10001
          --cap-drop ALL --security-opt no-new-privileges:true
          -v "$PWD/scripts:/smoke:ro" --entrypoint python clipper:ci /smoke/render_smoke.py
