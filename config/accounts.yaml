# Posting accounts (CLP-91): where approved clips are posted, and when.
# Validate with: uv run clipper check-config
#
# Token secrets are never written here. Each account reads them from the environment
# (or .env) by its id, e.g. for `mrbeast_clips_tt`:
#   CLIPPER_ACCESS_TOKEN_MRBEAST_CLIPS_TT, CLIPPER_REFRESH_TOKEN_MRBEAST_CLIPS_TT
# See docs/DEPLOYMENT.md, "Posting accounts".
#
# posts_per_day, min_gap_minutes and windows may be left out: the default plan for the
# platform and market (US or PH) is used. Windows are in the account's local timezone.
# warmup_start ramps an account from 1 post/day up to posts_per_day over warmup_days (14).
# Creators whose content type is public_service or vlog_lifestyle (or unset) are refused
# unless the account sets `licence: <reference to the signed licence>`. One licence covers
# one creator. Windows hold posts from start through end, and the plan must fit in them.
# Quote country codes YAML could misread, e.g. market: "NO".
# `content` is clips (the default) or commentary; see the commentary account below.
#
# Raffy Tulfo in Action, Ivana Alawi and Cong TV are paused until licensed (CLP-90): do
# not add accounts for them before a licence is signed.

accounts:
  - id: mrbeast_clips_tt
    platform: tiktok
    handle: "@mrbeast.clips.daily"
    market: US
    timezone: America/New_York
    creators: [MrBeast]
    posts_per_day: 3
    min_gap_minutes: 180
    windows: ["14:00-17:00", "18:00-22:00"]
    warmup_start: 2026-11-01
    campaign: vyro_mrbeast

  - id: mrbeast_clips_yt
    platform: youtube
    handle: "@mrbeast.clips.daily"
    market: US
    timezone: America/New_York
    creators: [MrBeast]
    posts_per_day: 2
    min_gap_minutes: 240
    windows: ["10:00-11:00", "13:00-14:00"]
    warmup_start: 2026-11-01
    campaign: vyro_mrbeast

  - id: mrbeast_clips_ig
    platform: instagram
    handle: "@mrbeast.clips.daily"
    market: US
    timezone: America/New_York
    creators: [MrBeast]
    posts_per_day: 2
    min_gap_minutes: 240
    windows: ["10:00-15:00"]
    warmup_start: 2026-11-01
    campaign: vyro_mrbeast

  - id: mrbeast_clips_fb
    platform: facebook
    handle: "mrbeast.clips.daily"
    market: US
    timezone: America/New_York
    creators: [MrBeast]
    posts_per_day: 2
    min_gap_minutes: 240
    windows: ["10:00-15:00"]
    warmup_start: 2026-11-01
    campaign: vyro_mrbeast

  # Commentary Shorts (CLP-142): the Random Gaming channel posts one narrated Short a day,
  # made from its channel in config/commentary.yaml. A commentary account has no creators,
  # campaign or licence, and never gets a creator's clip. channel_id is the channel its
  # refresh token must belong to. YouTube needs only CLIPPER_REFRESH_TOKEN_RANDOM_GAMING_YT.
  # The plan defaults to 1 post a day in the US YouTube windows; warmup_start is set at
  # go-live (CLP-150).
  - id: random_gaming_yt
    platform: youtube
    content: commentary
    channel_id: UCcMYw3Ae2crqXE2yzFBSUig
    handle: "@RandomGaming-f3w"
    market: US
    timezone: America/New_York

