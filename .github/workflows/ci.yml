name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.31"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov=clipper --cov-report=term-missing --cov-fail-under=80

      - name: Audit dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt > requirements.txt && uvx --python 3.12 --from pip-audit==2.10.1 pip-audit --strict --require-hashes --disable-pip -r requirements.txt

  node:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: render
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: render/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: clipper:ci
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      - name: Smoke test image
        run: |
          # The image user (uid 10001) must be able to write the DB dir.
          smoke="$(mktemp -d)" && chmod 777 "$smoke"
          run="docker run --rm --cap-drop ALL --security-opt no-new-privileges:true"
          $run -v "$PWD/config:/app/config:ro" clipper:ci --config /app/config/creators.yaml check-config
          $run -v "$smoke:/app/data" clipper:ci --db /app/data/state.db migrate
          $run --entrypoint yt-dlp clipper:ci --version
          $run --entrypoint ffmpeg clipper:ci -version
          $run --entrypoint node clipper:ci --version
          $run --read-only --tmpfs /tmp -w /app/render --entrypoint node clipper:ci node_modules/@remotion/cli/remotion-cli.js versions

      - name: Render smoke test (read-only, non-root)
        timeout-minutes: 10
        run: >-
          docker run --rm --read-only --tmpfs /tmp --user 10001:10001
          --cap-drop ALL --security-opt no-new-privileges:true
          -v "$PWD/scripts:/smoke:ro" --entrypoint python clipper:ci /smoke/render_smoke.py
